<script src="js/site.js"></script>
<script>
const ORCID      = '0000-0003-1070-8697';
const ORCID_TO   = 8000;
const CROSSREF_TO= 6000;

const TYPE_BADGE = {
  'review-article':  { label: 'Topical Review',  cls: 'badge-red',   icon: 'fas fa-book-open' },
  'journal-article': { label: 'Journal Article', cls: 'badge-green',  icon: 'fas fa-file-alt'  },
  'preprint':        { label: 'Preprint',         cls: 'badge-blue',  icon: 'fas fa-file-alt'  }
};

const normDOI  = doi => doi ? doi.trim().toLowerCase() : null;
const stripJats = s  => s ? s.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim() : '';

function fetchWithTimeout(url, opts = {}, ms) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(tid));
}

function buildCard(pub, idx) {
  const type  = TYPE_BADGE[pub.type] || { label: 'Publication', cls: 'badge-blue', icon: 'fas fa-file-alt' };

  const badges = [
    `<span class="badge ${type.cls}"><i class="${type.icon}"></i> ${type.label}</span>`,
    `<span id="cite-${idx}"></span>`,
    pub.year ? `<span class="badge badge-blue">${pub.year}</span>` : ''
  ].join('');

  const journalLink = pub.doi
    ? `<a href="https://doi.org/${pub.doi}" target="_blank" rel="noopener">${pub.journal || pub.doi}</a>`
    : (pub.journal || '');

  return `
    <article class="pub-card reveal" id="card-${idx}">
      <div class="pub-badges">${badges}</div>
      <h3 class="pub-title">${pub.title}</h3>
      <p class="pub-authors" id="authors-${idx}"></p>
      <p class="pub-journal">${journalLink}</p>
      <div class="pub-meta" id="meta-${idx}"></div>
      <p class="pub-desc" id="desc-${idx}"></p>
    </article>`;
}

async function fetchWorks() {
  const resp = await fetchWithTimeout(
    `https://pub.orcid.org/v3.0/${ORCID}/works`,
    { headers: { Accept: 'application/json' } },
    ORCID_TO
  );
  if (!resp.ok) throw new Error(`ORCID ${resp.status}`);
  const data = await resp.json();

  return (data.group || []).map(g => {
    const s   = g['work-summary'][0];
    const ids = s['external-ids']?.['external-id'] || [];
    const doi = ids.find(e => e['external-id-type'] === 'doi')?.['external-id-value'] || null;
    return {
      title:   s.title?.title?.value || '(Untitled)',
      year:    s['publication-date']?.year?.value || null,
      type:    s.type || 'journal-article',
      journal: s['journal-title']?.value || null,
      doi
    };
  });
}

async function enrichCard(pub, idx) {
  if (!pub.doi) return;
  try {
    const resp = await fetchWithTimeout(
      `https://api.crossref.org/works/${encodeURIComponent(pub.doi)}?mailto=deep.aggarwal895@gmail.com`,
      {},
      CROSSREF_TO
    );
    if (!resp.ok) return;
    const { message } = await resp.json();

    const shortTitle = (message['short-container-title'] || [])[0] || '';
    const volume     = message.volume || '';
    const locator    = message['article-number'] || message.page || '';
    if (shortTitle) {
      const volLoc = volume && locator ? `${volume}, ${locator}` : (volume || locator);
      const cite   = [shortTitle, volLoc].filter(Boolean).join(' ');
      const el = document.getElementById(`cite-${idx}`);
      if (el) el.outerHTML = `<span class="badge badge-gray">${cite}</span>`;
    }

    const authorList = (message.author || []).map(a => {
      const name = [a.given, a.family].filter(Boolean).join(' ');
      return (a.family?.toLowerCase() === 'aggarwal' && a.given?.toLowerCase().startsWith('d'))
        ? `<strong class="pub-author-self">${name}</strong>`
        : name;
    }).join(', ');
    if (authorList) {
      const el = document.getElementById(`authors-${idx}`);
      if (el) el.innerHTML = authorList;
    }

    // Metadata row: DOI, volume/issue, citations
    const metaParts = [];
    const doiVal = message.DOI;
    if (doiVal) {
      metaParts.push(`<span class="pub-meta-item"><i class="fas fa-fingerprint"></i> <a href="https://doi.org/${doiVal}" target="_blank" rel="noopener">${doiVal}</a></span>`);
    }
    const vol = message.volume || '';
    const iss = message.issue || '';
    const loc = message['article-number'] || message.page || '';
    const ref = [vol && `Vol. ${vol}`, iss && `Issue ${iss}`, loc && `${loc}`].filter(Boolean).join(', ');
    if (ref) {
      metaParts.push(`<span class="pub-meta-item"><i class="fas fa-book"></i> ${ref}</span>`);
    }
    const citations = message['is-referenced-by-count'];
    if (citations > 0) {
      metaParts.push(`<span class="pub-meta-item"><i class="fas fa-quote-right"></i> ${citations} citation${citations !== 1 ? 's' : ''}</span>`);
    }
    const metaEl = document.getElementById(`meta-${idx}`);
    if (metaEl && metaParts.length) metaEl.innerHTML = metaParts.join('');

    const abstract = stripJats(message.abstract || '');
    if (abstract) {
      const el = document.getElementById(`desc-${idx}`);
      if (el) el.textContent = abstract;
    }
  } catch { /* silent */ }
}

async function loadPublications() {
  const grid    = document.getElementById('pub-grid');
  const loading = document.getElementById('pub-loading');
  try {
    const works = await fetchWorks();
    works.sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
    grid.innerHTML = works.map(buildCard).join('');
    grid.hidden    = false;
    if (loading) loading.remove();
    initReveal(grid);
    works.forEach((pub, idx) => enrichCard(pub, idx));
  } catch (err) {
    console.error('ORCID load failed:', err);
    if (loading) loading.remove();
  }
}

loadPublications();
</script>
